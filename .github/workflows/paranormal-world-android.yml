# Builds the Paranormal World Android app on every push that changes it,
# runs the unit tests and Android lint, uploads the debug APK so it can be downloaded and
# installed, and runs the device tests on an emulator.
name: Paranormal World Android

on:
  push:
    paths:
      - "paranormal-world-android/**"
      - ".github/workflows/paranormal-world-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paranormal-world-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paranormal-world-debug
          path: |
            paranormal-world-android/app/build/outputs/apk/debug/*.apk
            paranormal-world-android/app/build/reports/lint-results-debug.html

  # Runs the tests in app/src/androidTest on an Android emulator:
  # the database tests and a tap-through of the main CaseLink journey.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: paranormal-world-android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paranormal-world-device-test-report
          path: paranormal-world-android/app/build/reports/androidTests/connected/
