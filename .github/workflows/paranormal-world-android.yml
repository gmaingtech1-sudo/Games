# Builds the Paranormal World Android app on every push that changes it,
# runs Android lint, and uploads the debug APK so it can be downloaded and installed.
name: Paranormal World Android

on:
  push:
    paths:
      - "paranormal-world-android/**"
      - ".github/workflows/paranormal-world-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paranormal-world-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Lint
        run: ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paranormal-world-debug
          path: |
            paranormal-world-android/app/build/outputs/apk/debug/*.apk
            paranormal-world-android/app/build/reports/lint-results-debug.html
