# JARVIS AI: tests and builds on GitHub's servers.
# - backend + UI tests
# - Android: Gradle unit/Robolectric tests, debug + release APKs (downloadable artifacts)
# - Windows: .NET tests, the JARVIS AI installer and portable zip (downloadable artifacts)
name: JARVIS AI

on:
  push:
    paths:
      - "jarvis-ai/**"
      - ".github/workflows/jarvis-ai.yml"
  pull_request:
    paths:
      - "jarvis-ai/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: jarvis-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix backend
      - run: npm --prefix backend test
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: jarvis-ai/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM + Robolectric)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: jarvis-ai/android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-android-apk
          path: |
            jarvis-ai/android/app/build/outputs/apk/debug/*.apk
            jarvis-ai/android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: jarvis-ai/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test, publish and package (installer + portable zip)
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-windows
          path: jarvis-ai/windows/dist/
