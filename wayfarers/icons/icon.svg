  <path d="M196 432 L316 404 M196 404 L316 432" stroke="#6B4A2E" stroke-width="18" stroke-linecap="round"/>
  <path d="M256 280 C300 330 318 360 300 400 C290 424 222 424 212 400 C196 362 226 340 236 310 C244 332 252 340 262 344 C266 320 262 300 256 280Z" fill="url(#fire)"/>
