<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1F5A"/>
      <stop offset="0.6" stop-color="#6B3F8F"/>
      <stop offset="1" stop-color="#F09A5B"/>
    </linearGradient>
    <radialGradient id="fire" cx="50%" cy="70%" r="60%">
      <stop offset="0" stop-color="#FFF6C2"/>
      <stop offset="0.4" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#FF6A2B"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC94A" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFC94A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="390" cy="120" r="34" fill="#FFF3D6"/>
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="90" cy="90" r="3"/><circle cx="160" cy="60" r="2"/><circle cx="250" cy="110" r="2.5"/><circle cx="60" cy="180" r="2"/>
  </g>
  <path d="M0 330 L90 230 L160 300 L250 200 L340 290 L420 220 L512 300 L512 512 L0 512Z" fill="#3B2A6B"/>
  <path d="M0 380 Q130 320 256 360 T512 350 L512 512 L0 512Z" fill="#2A1F4F"/>
